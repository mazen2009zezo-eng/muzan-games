<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Flyer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{width:100%;background:#04060a;color:#eee;padding:8px;overflow-y:auto}
#app{max-width:420px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 7px;gap:8px}
.tt{font:900 18px 'Arial Black';color:#ff007f;text-shadow:0 0 10px #ff007f88;letter-spacing:1.5px}
.tt small{display:block;font:700 6.5px Arial;letter-spacing:2px;color:#00f3ff;text-shadow:none}
.hrs{display:flex;gap:6px;align-items:center}
.hr{background:rgba(0,0,0,.6);border:1px solid rgba(255,0,127,.35);border-radius:9px;padding:3px 9px;text-align:center;min-width:54px}
.hr i{display:block;font:700 7px Arial;font-style:normal;letter-spacing:1px;color:#8a92a6}
.hr b{font:900 13px 'Arial Black';color:#eef1f8;font-variant-numeric:tabular-nums}
.mbtn{width:34px;height:34px;border:2px solid rgba(255,0,127,.35);border-radius:9px;background:rgba(0,0,0,.6);color:#eef1f8;font-size:15px;cursor:pointer}
.gw{position:relative;border:2px solid rgba(255,0,127,.4);border-radius:14px;overflow:hidden;background:#030208;box-shadow:0 0 20px rgba(255,0,127,.2)}
canvas{width:100%;display:block;touch-action:none}
.pads{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px;margin-top:8px}
.pd{height:52px;border:2px solid rgba(255,255,255,.16);border-radius:14px;font:900 13px 'Arial Black';color:#fff;cursor:pointer;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.6);background:linear-gradient(#1a2638,#0d1522 60%,#060a12)}
.pd:active{transform:translateY(3px);box-shadow:none;filter:brightness(1.5)}
#atkB{background:linear-gradient(#ff007f,#99004d 60%,#660033);color:#fff;border-color:rgba(255,0,127,.6)}
.ub{margin-top:8px;width:100%;height:40px;border:2px solid rgba(255,0,127,.5);border-radius:12px;font:900 13px 'Arial Black';color:#fff;background:#0c0312;cursor:pointer;letter-spacing:2px}
.ub.rdy{background:linear-gradient(90deg,#ff007f,#ff55c8);box-shadow:0 0 16px #ff007faa}
.hint{text-align:center;font:600 9px Arial;color:#8a92a6;margin-top:6px}
</style>
</head>
<body>
<div id="app">
<div class="hdr">
<div class="tt">NEON FLYER<small>CYBER ARCADE</small></div>
<div class="hrs">
<div class="hr"><i>SCORE</i><b id="sc">0</b></div>
<div class="hr"><i>BEST</i><b id="bs">0</b></div>
<button class="mbtn" id="muteB">🔊</button>
</div>
</div>
<div class="gw"><canvas id="cv" width="404" height="380"></canvas></div>
<div class="pads">
<button class="pd" id="leftB">◀</button>
<button class="pd" id="atkB">💥 JUMP</button>
<button class="pd" id="rightB">▶</button>
</div>
<button class="ub" id="ultB">⚡ START GAME</button>
<div class="hint">اضغط JUMP للقفز · تجنب العوائق · اجمع النقاط</div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),x=cv.getContext('2d'),W=404,H=380,DPR=2;
cv.width=W*DPR;cv.height=H*DPR;
var scEl=document.getElementById('sc'),bsEl=document.getElementById('bs'),ub=document.getElementById('ultB');
var BEST=0;try{BEST=parseInt(localStorage.getItem('neonflyer_best')||'0',10)||0}catch(e){}
bsEl.textContent=BEST;
var AC=null,MUTED=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)}catch(e){return null}}if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}return AC}
function tone(f,d,t,v,at,sl){var a=AC;if(!a||MUTED)return;try{var n=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(v||.1,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.03)}catch(e){}}
function sJump(){tone(300,.15,'sine',.15,0,700)}
function sCrash(){tone(120,.3,'sawtooth',.3,0,30)}
var state='ready',frame=0,score=0,best=BEST,hp=100,iframe=0,camZ=0,scroll=5.5,shake=0,flashR=0;
var lane=0,px=0,pv=0,playerX=W/2,ents=[],nitro=0,nitroT=0,overT=0,obsAt=300,droneAt=450;
function reset(){score=0;hp=100;iframe=0;camZ=0;scroll=5.5;shake=0;flashR=0;lane=0;px=0;pv=0;playerX=W/2;nitro=0;nitroT=0;ents=[];obsAt=camZ+300;droneAt=camZ+450;scEl.textContent='0';ub.classList.remove('rdy');ub.textContent='⚡ START GAME'}
function mv(d){ac();if(state!=='play')return;var nl=Math.max(-1,Math.min(1,lane+d));if(nl!==lane){lane=nl;tone(350,.04,'square',.05)}}
function jump(){ac();if(state==='ready'){state='play';reset();return}if(state==='dead'&&performance.now()-overT>800){state='play';reset();return}if(state!=='play')return;sJump()}
function tryNitro(){ac();if(state!=='play')return;if(nitro>=100&&nitroT===0){nitroT=300;nitro=0;ub.classList.remove('rdy');ub.textContent='⚡ HYPER NITRO — 0%'}}
document.getElementById('leftB').addEventListener('pointerdown',function(e){e.preventDefault();mv(-1)});
document.getElementById('rightB').addEventListener('pointerdown',function(e){e.preventDefault();mv(1)});
document.getElementById('atkB').addEventListener('pointerdown',function(e){e.preventDefault();jump()});
ub.addEventListener('pointerdown',function(e){e.preventDefault();if(state==='ready'||state==='dead'){jump();return}tryNitro()});
document.getElementById('muteB').addEventListener('pointerdown',function(e){e.preventDefault();MUTED=!MUTED;document.getElementById('muteB').textContent=MUTED?'🔇':'🔊'});
function dmg(n){if(iframe>0||nitroT>0||state!=='play')return;hp=Math.max(0,hp-n);iframe=70;shake=10;flashR=.6;sCrash();if(hp<=0){state='dead';overT=performance.now();if(score>best){best=score;bsEl.textContent=best;try{localStorage.setItem('neonflyer_best',best)}catch(e){}}}}
function spawn(){if(camZ>obsAt){var r=Math.random(),l=Math.floor(Math.random()*3)-1;if(r<.4)ents.push({t:'barrier',z:380,lane:l});else if(r<.7)ents.push({t:'spike',z:380,lane:l});else ents.push({t:'mine',z:380,lane:l});obsAt=camZ+260+Math.random()*240}if(camZ>droneAt){ents.push({t:'drone',z:380,lane:Math.floor(Math.random()*3)-1});droneAt=camZ+320+Math.random()*300}}
function update(){frame++;shake=Math.max(0,shake-.5);flashR=Math.max(0,flashR-.03);if(iframe>0)iframe--;if(nitroT>0)nitroT--;var curScroll=scroll+(nitroT>0?4.5:0);camZ+=curScroll;score+=Math.round(curScroll*.12);if(frame%6===0)scEl.textContent=Math.floor(score);var tgt=lane*38;pv+=(tgt-px)*.55;pv*=.42;px+=pv;playerX=W/2+px;if(state!=='play')return;spawn();for(var i=ents.length-1;i>=0;i--){var e2=ents[i];e2.z-=curScroll;if(e2.z<15&&e2.z>-20){if(e2.lane===Math.round(px/38)){if(nitroT>0){e2.rm=true;score+=80}else if(!e2.hit){e2.hit=true;dmg(18)}}}if(e2.z<-50||e2.rm)ents.splice(i,1)}if(nitroT===0){nitro=Math.min(100,nitro+0.05);ub.textContent='⚡ HYPER NITRO — '+Math.floor(nitro)+'%';if(nitro>=100)ub.classList.add('rdy')}}
function drawGrid(){x.fillStyle='#090614';x.fillRect(0,0,W,H);x.strokeStyle='#ff007f';x.lineWidth=3;x.beginPath();x.moveTo(W/2-60,270);x.lineTo(W/2-21,150);x.stroke();x.beginPath();x.moveTo(W/2+60,270);x.lineTo(W/2+21,150);x.stroke();x.strokeStyle='rgba(255,0,127,0.3)';x.lineWidth=1.5;for(var k=0;k<8;k++){var z=k*50-(camZ%50);if(z<0||z>380)continue;var sy=270-(z/380)*120,w=60*(1-z/380*.65);x.beginPath();x.moveTo(W/2-w,sy);x.lineTo(W/2+w,sy);x.stroke()}}
function drawPlayer(){if(state==='dead')return;if(iframe>0&&Math.floor(frame/3)%2===0)return;x.save();x.translate(playerX,270);x.rotate(pv*.012);var fg=x.createLinearGradient(0,10,0,25);fg.addColorStop(0,nitroT>0?'#ff007f':'#00f3ff');fg.addColorStop(1,'transparent');x.fillStyle=fg;x.fillRect(-6,10,12,12+Math.random()*8);x.fillStyle='#0e1726';x.strokeStyle=nitroT>0?'#ff007f':'#00f3ff';x.lineWidth=2;x.beginPath();x.moveTo(0,-18);x.lineTo(-14,6);x.lineTo(-8,12);x.lineTo(8,12);x.lineTo(14,6);x.closePath();x.fill();x.stroke();x.fillStyle='#fff';x.beginPath();x.ellipse(0,-4,4,7,0,0,7);x.fill();x.restore()}
function drawEnt(e){var z=e.z,sc=1-z/380*.65,sy=270-(z/380)*120,sx=W/2+e.lane*38*sc;if(sy<150||sy>290)return;x.save();x.translate(sx,sy);x.scale(sc,sc);if(e.t==='barrier'){x.fillStyle='rgba(255,0,127,0.2)';x.strokeStyle='#ff007f';x.lineWidth=2;x.fillRect(-22,-24,44,24);x.strokeRect(-22,-24,44,24)}else if(e.t==='spike'){x.fillStyle='#ffe600';x.beginPath();x.moveTo(-18,0);x.lineTo(0,-22);x.lineTo(18,0);x.closePath();x.fill()}else if(e.t==='mine'){x.fillStyle='#ff3050';x.beginPath();x.arc(0,-10,12,0,7);x.fill()}else if(e.t==='drone'){x.fillStyle='#121826';x.strokeStyle='#00f3ff';x.lineWidth=2;x.beginPath();x.moveTo(-20,-10);x.lineTo(0,-22);x.lineTo(20,-10);x.lineTo(0,0);x.closePath();x.fill();x.stroke();x.fillStyle='#ff3050';x.beginPath();x.arc(0,-11,4,0,7);x.fill()}x.restore()}
function draw(){x.setTransform(DPR,0,0,DPR,0,0);x.fillStyle='#040208';x.fillRect(0,0,W,H);x.save();if(shake>0)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawGrid();ents.forEach(drawEnt);drawPlayer();x.restore();if(flashR>0){x.fillStyle='rgba(255,40,80,'+(flashR*.3)+')';x.fillRect(0,0,W,H)}x.fillStyle='rgba(0,0,0,0.6)';x.fillRect(W/2-70,10,140,12);x.fillStyle=hp>30?'#ff007f':'#ff3050';x.fillRect(W/2-68,12,136*(hp/100),8);if(state==='ready'){x.fillStyle='rgba(3,2,8,0.75)';x.fillRect(0,0,W,H);x.textAlign='center';x.font='900 26px Arial';x.fillStyle='#ff007f';x.fillText('NEON FLYER',W/2,160);x.font='700 10px Arial';x.fillStyle='#00f3ff';x.fillText('اضغط START للبدء',W/2,185)}else if(state==='dead'){x.fillStyle='rgba(3,2,8,0.8)';x.fillRect(0,0,W,H);x.textAlign='center';x.font='900 26px Arial';x.fillStyle='#ff3050';x.fillText('GAME OVER',W/2,160);x.font='700 12px monospace';x.fillStyle='#fff';x.fillText('SCORE: '+Math.floor(score),W/2,190);x.font='700 10px Arial';x.fillStyle='#8a92a6';x.fillText('اضغط START لإعادة اللعب',W/2,215)}}
function loop(){update();draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
